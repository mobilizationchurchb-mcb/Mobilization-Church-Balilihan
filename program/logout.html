<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - MCB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen flex items-center justify-center p-0 m-0">

    <!-- Main content card – centered exactly in the viewport -->
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md text-center">
        <!-- Loading indicator -->
        <div id="loadingState">
            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent mx-auto mb-3"></div>
            <p class="text-gray-600">Loading your information…</p>
        </div>

        <!-- User info (hidden until loaded) -->
        <div id="userInfo" class="hidden">
            <div id="profilePicContainer" class="mb-4">
                <!-- profile picture or initials generated by JS -->
            </div>
            <h2 class="text-2xl font-bold text-gray-800" id="memberNameDisplay">User Name</h2>
            <span class="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium mt-2" id="memberRoleDisplay">Role</span>
            <p class="mt-6 text-gray-500 text-sm">Are you sure you want to log out?</p>
            <button id="logoutBtn" class="mt-4 bg-red-600 text-white px-6 py-2.5 rounded-lg hover:bg-red-700 transition font-medium w-full">
                🚪 Logout
            </button>
        </div>

        <!-- Error state (hidden until needed) -->
        <div id="errorState" class="hidden">
            <p class="text-red-500 font-medium">Unable to load profile.</p>
            <button onclick="clearSessionAndRedirect()" class="mt-4 bg-gray-600 text-white px-6 py-2.5 rounded-lg hover:bg-gray-700 transition font-medium w-full">
                Return to Login
            </button>
        </div>
    </div>

    <script src="program_navbar.js"></script>

    <script>
    (function() {
        const SUPABASE_URL = 'https://mjpahhjaefflposesygk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcGFoaGphZWZmbHBvc2VzeWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjQzMDMsImV4cCI6MjEwMDQ0MDMwM30.cNMzs1TxHKPbWKtY9xZD6W29nSU1ocvm8n5pjE68d1g';

        // Read session from localStorage
        const memberId = localStorage.getItem('memberId');
        const isLoggedIn = localStorage.getItem('memberLoggedIn') === 'true';

        // If not logged in, redirect immediately to portal login
        if (!isLoggedIn || !memberId) {
            window.location.href = '../portal_login.html';
            return;
        }

        // Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loadingState = document.getElementById('loadingState');
        const userInfo = document.getElementById('userInfo');
        const errorState = document.getElementById('errorState');
        const logoutBtn = document.getElementById('logoutBtn');

        async function loadProfile() {
            try {
                const { data: member, error } = await supabase
                    .from('members')
                    .select('*')
                    .eq('id', memberId)
                    .single();

                if (error || !member) throw new Error('Member not found');

                document.getElementById('memberNameDisplay').textContent =
                    `${member.first_name} ${member.last_name}`;

                const roleMap = {
                    'program': '📋 Program',
                    'music': '🎵 Music',
                    'pastoral': '⛪ Pastoral',
                    'member': '👤 Member',
                    'treasurer': '💰 Treasurer'
                };
                document.getElementById('memberRoleDisplay').textContent =
                    roleMap[member.role] || member.role;

                const picContainer = document.getElementById('profilePicContainer');
                if (member.profile_picture) {
                    const { data: { publicUrl } } = supabase.storage
                        .from('member-photos')
                        .getPublicUrl(member.profile_picture);
                    picContainer.innerHTML = `<img src="${publicUrl}" alt="Profile" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md mx-auto">`;
                } else {
                    const initials = (member.first_name?.[0] || '') + (member.last_name?.[0] || '');
                    picContainer.innerHTML = `<div class="w-24 h-24 rounded-full bg-blue-600 text-white flex items-center justify-center text-3xl font-bold shadow-md mx-auto">${initials}</div>`;
                }

                loadingState.classList.add('hidden');
                userInfo.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                loadingState.classList.add('hidden');
                errorState.classList.remove('hidden');
            }
        }

        function clearSessionAndRedirect() {
            localStorage.removeItem('memberLoggedIn');
            localStorage.removeItem('memberId');
            localStorage.removeItem('memberRole');
            localStorage.removeItem('memberName');
            localStorage.removeItem('rememberedMemberUsername');
            window.location.href = '../portal_login.html';
        }

        logoutBtn.addEventListener('click', clearSessionAndRedirect);
        loadProfile();
    })();
    </script>
</body>
</html>
