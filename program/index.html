<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Dashboard - MCB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Full‑screen on mobile */
        @media (max-width: 767px) {
            #main-content {
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">

    <!-- Main content wrapper (will be wrapped by program_navbar.js) -->
    <div class="w-full px-4 py-6 md:px-6">
        <!-- Profile & Welcome + Daily Verse -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- Profile Card -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-lg p-6 flex flex-col sm:flex-row items-center gap-6">
                <div id="profilePicContainer" class="flex-shrink-0"></div>
                <div class="text-center sm:text-left flex-1">
                    <h2 class="text-2xl font-bold text-gray-800">Welcome,</h2>
                    <p class="text-xl text-blue-600 font-semibold" id="memberName">User</p>
                    <p class="text-sm text-gray-500 mt-1" id="greeting"></p>
                </div>
            </div>

            <!-- Daily Bible Verse -->
            <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col items-center justify-center">
                <div class="text-center">
                    <h3 class="text-lg font-semibold text-gray-800 mb-2">📖 Verse of the Day</h3>
                    <p class="text-gray-600 italic text-sm leading-relaxed" id="verseText">Loading...</p>
                    <p class="text-blue-600 font-medium mt-2 text-sm" id="verseRef"></p>
                </div>
            </div>
        </div>

        <!-- Total Programs Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl shadow-lg p-6 flex flex-col items-center">
                <span class="text-4xl font-bold text-blue-600" id="totalPrograms">0</span>
                <span class="text-sm text-gray-600 mt-1">Total Programs</span>
            </div>
        </div>

        <!-- MC List Table -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">📋 Program MC List</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="text-left py-3 px-4 font-medium text-gray-500 uppercase tracking-wider">MC Name</th>
                            <th class="text-left py-3 px-4 font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="text-left py-3 px-4 font-medium text-gray-500 uppercase tracking-wider">Pastor</th>
                        </tr>
                    </thead>
                    <tbody id="programTableBody" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="3" class="text-center py-4 text-gray-400">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="program_navbar.js"></script>

    <script>
    (function() {
        const SUPABASE_URL = 'https://mjpahhjaefflposesygk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcGFoaGphZWZmbHBvc2VzeWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjQzMDMsImV4cCI6MjEwMDQ0MDMwM30.cNMzs1TxHKPbWKtY9xZD6W29nSU1ocvm8n5pjE68d1g';

        // Session check
        const memberId = localStorage.getItem('memberId');
        const isLoggedIn = localStorage.getItem('memberLoggedIn') === 'true';
        const role = localStorage.getItem('memberRole');
        if (!isLoggedIn || !memberId || role !== 'program') {
            window.location.href = '../portal_login.html';
            return;
        }

        // Supabase client with RLS header
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            global: { headers: { 'x-member-id': memberId } }
        });

        // Greeting
        const hour = new Date().getHours();
        const greetingText = hour >= 5 && hour < 12 ? 'Good Morning ☀️' :
                            hour >= 12 && hour < 17 ? 'Good Afternoon 🌤️' :
                            hour >= 17 && hour < 21 ? 'Good Evening 🌙' : 'Good Night 🌃';
        document.getElementById('greeting').textContent = greetingText;

        // Load profile
        async function loadProfile() {
            const { data: member, error } = await supabase
                .from('members')
                .select('*')
                .eq('id', memberId)
                .single();
            if (error || !member) {
                alert('Unable to load profile.');
                return;
            }
            const fullName = `${member.first_name} ${member.last_name}`;
            document.getElementById('memberName').textContent = fullName;

            const picContainer = document.getElementById('profilePicContainer');
            if (member.profile_picture) {
                const { data: { publicUrl } } = supabase.storage
                    .from('member-photos')
                    .getPublicUrl(member.profile_picture);
                picContainer.innerHTML = `<img src="${publicUrl}" alt="Profile" class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md">`;
            } else {
                const initials = (member.first_name?.[0] || '') + (member.last_name?.[0] || '');
                picContainer.innerHTML = `<div class="w-20 h-20 rounded-full bg-blue-600 text-white flex items-center justify-center text-2xl font-bold shadow-md">${initials}</div>`;
            }
        }

        // Load programs
        async function loadPrograms() {
            const { count, error: countError } = await supabase
                .from('sunday_programs')
                .select('*', { count: 'exact', head: true });
            if (!countError) {
                document.getElementById('totalPrograms').textContent = count;
            }
            const { data, error } = await supabase
                .from('sunday_programs')
                .select('mc_name, program_date, pastor')
                .order('program_date', { ascending: false })
                .limit(10);
            const tbody = document.getElementById('programTableBody');
            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-gray-400">No programs found.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(prog => `
                <tr class="hover:bg-gray-50 transition">
                    <td class="py-3 px-4">${prog.mc_name || '—'}</td>
                    <td class="py-3 px-4">${prog.program_date ? new Date(prog.program_date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '—'}</td>
                    <td class="py-3 px-4">${prog.pastor || '—'}</td>
                </tr>
            `).join('');
        }

        // ----- Daily Bible Verse (using reliable OurManna API) -----
        async function loadDailyVerse() {
            const verseTextEl = document.getElementById('verseText');
            const verseRefEl = document.getElementById('verseRef');
            const today = new Date().toLocaleDateString('en-CA');
            const stored = JSON.parse(localStorage.getItem('dailyVerse') || 'null');

            // If we already have today's verse cached, show it
            if (stored && stored.date === today) {
                verseTextEl.textContent = stored.text;
                verseRefEl.textContent = stored.reference;
                return;
            }

            try {
                const res = await fetch('https://beta.ourmanna.com/api/v1/get?format=json&order=daily');
                const data = await res.json();
                const verseDetail = data.verse;
                if (verseDetail && verseDetail.details && verseDetail.details.text) {
                    const text = verseDetail.details.text;
                    const ref = verseDetail.details.reference;
                    verseTextEl.textContent = text;
                    verseRefEl.textContent = ref;

                    // Cache until tomorrow
                    localStorage.setItem('dailyVerse', JSON.stringify({
                        date: today,
                        text: text,
                        reference: ref
                    }));
                } else {
                    throw new Error('Verse not found');
                }
            } catch (err) {
                console.error('Daily verse error:', err);
                // Fallback to a static verse if API fails completely
                verseTextEl.textContent = '"For I know the plans I have for you," declares the LORD, "plans to prosper you and not to harm you, plans to give you hope and a future."';
                verseRefEl.textContent = 'Jeremiah 29:11';
            }
        }

        loadProfile();
        loadPrograms();
        loadDailyVerse();
    })();
    </script>
</body>
</html>
