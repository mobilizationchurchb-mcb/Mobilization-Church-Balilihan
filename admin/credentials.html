<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credentials - MCB</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1100px;
            margin: 0 auto;
        }
        .page-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .search-bar input {
            padding: 10px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: #f8fafc;
            color: #334155;
            flex: 1;
            min-width: 200px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
            font-size: 14px;
        }
        tr:hover td {
            background: #f8fafc;
        }
        .profile-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #e2e8f0;
            background: #f1f5f9;
        }
        .profile-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
        }
        .btn-view {
            background: #e0f2fe;
            color: #0284c7;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-view:hover {
            background: #bae6fd;
            transform: translateY(-1px);
        }
        /* Modal overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        .card-landscape {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            padding: 30px 25px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 560px;
            max-width: 100%;
            margin: 0 auto 20px;
            box-shadow: 0 10px 30px rgba(102,126,234,0.4);
            position: relative;
        }
        .card-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.15);
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 15px;
        }
        .card-label {
            font-weight: 600;
        }
        .card-value {
            font-weight: 500;
            word-break: break-all;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
            position: absolute;
            top: 10px;
            right: 15px;
        }
        .download-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(16,185,129,0.3);
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16,185,129,0.5);
        }
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            .card-landscape {
                width: 100%;
                padding: 20px;
            }
            .card-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="container">
            <h1 class="page-title">Credentials User Account</h1>
            <p class="page-subtitle">
                View and share login credentials. The default password is the member’s <strong>ID Number</strong> (e.g., MCB123).
            </p>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by name or email...">
            </div>

            <div class="table-wrapper">
                <table id="credentialsTable">
                    <thead>
                        <tr>
                            <th>Profile</th>
                            <th>Full Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3" style="text-align:center; padding:30px;">Loading members...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modal for viewing credentials -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content">
                <button class="close-btn" onclick="closeModal()">&times;</button>
                <div id="credentialCard" class="card-landscape">
                    <div class="card-header">Your Account Credentials</div>
                    <div class="card-row">
                        <span class="card-label">👤 Username</span>
                        <span class="card-value" id="modalUsername">-</span>
                    </div>
                    <div class="card-row">
                        <span class="card-label">🔑 Password (ID Number)</span>
                        <span class="card-value" id="modalPassword">-</span>
                    </div>
                </div>
                <button class="download-btn" onclick="downloadCard()">📥 Download Card</button>
            </div>
        </div>
    </div>

    <script src="admin_navbar.js"></script>
    <script>
    (function() {
        const SUPABASE_URL = 'https://mjpahhjaefflposesygk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcGFoaGphZWZmbHBvc2VzeWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NjQzMDMsImV4cCI6MjEwMDQ0MDMwM30.cNMzs1TxHKPbWKtY9xZD6W29nSU1ocvm8n5pjE68d1g';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tableBody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalUsername = document.getElementById('modalUsername');
        const modalPassword = document.getElementById('modalPassword');

        let allMembers = [];

        async function fetchMembers() {
            tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:30px;">Loading members...</td></tr>`;
            const { data, error } = await supabase
                .from('members')
                .select('*')
                .order('last_name', { ascending: true });

            if (error) {
                console.error(error);
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:30px;">Failed to load members.</td></tr>`;
                return;
            }
            allMembers = data || [];
            renderTable(allMembers);
        }

        function renderTable(members) {
            if (members.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:30px;">No members found.</td></tr>`;
                return;
            }
            tableBody.innerHTML = members.map(member => {
                const fullName = `${member.first_name} ${member.last_name}`;
                const initials = (member.first_name?.[0] || '') + (member.last_name?.[0] || '');
                let profilePic = '';
                if (member.profile_picture) {
                    const { data: { publicUrl } } = supabase.storage
                        .from('member-photos')
                        .getPublicUrl(member.profile_picture);
                    profilePic = publicUrl;
                }
                return `
                    <tr>
                        <td>
                            <div class="profile-cell">
                                ${profilePic 
                                    ? `<img src="${profilePic}" alt="${fullName}" class="profile-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` 
                                    : ''}
                                <div class="profile-placeholder" style="${profilePic ? 'display:none' : ''}">${initials}</div>
                            </div>
                        </td>
                        <td>${fullName}</td>
                        <td><button class="btn-view" onclick='openModal(${JSON.stringify(member)})'>👁️ View</button></td>
                    </tr>
                `;
            }).join('');
        }

        // Search filter
        searchInput.addEventListener('input', function() {
            const term = this.value.toLowerCase();
            const filtered = allMembers.filter(m => 
                (m.first_name + ' ' + m.last_name).toLowerCase().includes(term) ||
                (m.email || '').toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        // Modal functions
        window.openModal = function(member) {
            modalUsername.textContent = member.username || 'N/A';
            // Password is now the ID number (default password)
            modalPassword.textContent = member.id_number || 'N/A';
            modalOverlay.style.display = 'flex';
        };

        window.closeModal = function() {
            modalOverlay.style.display = 'none';
        };

        // Close modal on overlay click
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });

        // Download card function
        window.downloadCard = function() {
            const cardElement = document.getElementById('credentialCard');
            html2canvas(cardElement, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'credentials-card.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        };

        fetchMembers();
    })();
    </script>
</body>
</html>
